[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["browser: requires an installed Chromium browser"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*", "docs/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
