services:
  - type: web
    name: faculty-attendance-register
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /health/
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: REGISTER_ENV
        value: production
      - key: REGISTER_DATA_DIR
        value: ./var
      - key: REGISTER_SECRET_KEY
        generateValue: true
      - key: REGISTER_TRUST_PROXY
        value: "1"
