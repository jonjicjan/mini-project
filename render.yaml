databases:
  - name: faculty-register-db
    databaseName: register
    user: register
    plan: free
    region: oregon

services:
  - type: web
    name: faculty-attendance-register
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /health/
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: REGISTER_ENV
        value: production
      - key: REGISTER_DATA_DIR
        value: ./var
      - key: REGISTER_SECRET_KEY
        generateValue: true
      - key: REGISTER_TRUST_PROXY
        value: "1"
      - key: REGISTER_ALLOWED_HOSTS
        value: mini-project-2-7lhe.onrender.com,localhost,127.0.0.1
      - key: REGISTER_DATABASE_URL
        fromDatabase:
          name: faculty-register-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_DISPLAY_NAME
        value: Administrator
      - key: ADMIN_PASSWORD
        sync: false
