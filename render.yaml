services:
  - type: web
    name: faculty-attendance-register
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: REGISTER_ENV
        value: production
      - key: REGISTER_DATA_DIR
        value: ./var
      - key: REGISTER_SECRET_KEY
        generateValue: true
      - key: REGISTER_TRUST_PROXY
        value: "1"
      - key: REGISTER_ALLOWED_HOSTS
        value: faculty-attendance-register.onrender.com,localhost,127.0.0.1
